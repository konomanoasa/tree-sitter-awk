[package]
authors = [ "konomanoasa" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Tree-sitter grammar for POSIX awk."
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "awk" ]
license = "MIT"
name = "tree-sitter-awk"
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-awk"
version = "0.5.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
