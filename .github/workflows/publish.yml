name: Publish

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: brew install llvm
      - run: npm ci
      - run: npm run check
      - run: npm publish
